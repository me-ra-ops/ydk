<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>About Section</title>

<style>
/* ========== GLOBAL ========== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

/* ========== ABOUT SECTION ========== */
#about{
  position: relative;
  min-height: 100vh;
  overflow: hidden;

  background:
    linear-gradient(
      rgba(6, 7, 22, 0.85),
      rgba(0,0,0,0.95)
    ),
    url("about (2).jpg") center / cover no-repeat;
}


/* ========== LEFT SLANTED PANEL WITH IMAGE ========== */
.about-left-panel{
  position:absolute;
  top:0;
  left:-300px;
  width:1000px;
  height:100%;
  background:
    linear-gradient(rgba(6, 46, 168, 0.75), rgba(2, 4, 10, 0.75)),
    url("download (2).jpg") center / cover no-repeat;

  transform: skewX(-20deg) translateX(-120%);
  z-index:1;
  animation: slideInLeft 1.2s ease-out forwards;
}

/* Panel animation */
@keyframes slideInLeft{
  from{
    transform: skewX(-20deg) translateX(-120%);
    opacity:0;
  }
  to{
    transform: skewX(-20deg) translateX(0);
    opacity:1;
  }
}

/* ========== INNER CONTENT (NOW ANIMATED) ========== */
.about-inner{
  position:relative;
  z-index:2;
  padding:80px;
  color:white;

  transform: translateX(-80px);
  opacity:0;
  animation: contentSlideIn 1.2s ease-out forwards;
  animation-delay: 0.15s; /* slight sync polish */
}

@keyframes contentSlideIn{
  to{
    transform: translateX(0);
    opacity:1;
  }
}

/* ========== BOXES ========== */
.about-box-container{
  position:relative;
  width:200px;
  height:200px;
  margin-top:60px;
}

.about-box{
  position:absolute;
  width:250px;
  height:250px;
  border:3px solid #ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:0.3s ease;
  background: rgba(0,0,0,0.25);
}

.about-box span{
  font-size:18px;
  font-weight:bold;
  letter-spacing:1px;
}

.box1{ top:0; left:150px; }
.box2{ top:150px; left:50xp; }
.box3{ top:180px; left:180px; }

.about-box:hover{
  transform:scale(1.12);
  z-index:10;
  box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

/* ========== POPUP ========== */
#about-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  z-index:100;
}

.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:40px;
  width:500px;
  box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

.popup span{
  position:absolute;
  top:10px;
  right:15px;
  cursor:pointer;
  font-size:20px;
}

/* ========== TYPOGRAPHY ========== */
h1{
  font-size:2.25rem;
  line-height:1.3;
  letter-spacing:0.5rem;
}

h2{
  font-size:1.5rem;
}

@media (max-width:736px){
  h1{ font-size:1.75rem; }
}


*menu section*/
/* Base menu styling */
.nav-link {
    color: var(--moonlight);
    padding: 0.8rem 1.5rem;
    position: relative;
    border-radius: 8px;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
    z-index: 1;
}

/* Digital underline effect*/
.nav-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent 0%,
        var(--electric-blue) 50%,
        transparent 100%
    );
    background-size: 200% 100%;
    transform: translateX(-50%);
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    border-radius: 1px;
}

.nav-link:hover {
    color: var(--electric-blue);
}

.nav-link:hover::after {
    width: 80%;
    animation: digitalFlow 2s linear infinite;
}

/* Active state matching countdown cards */
.nav-link.active {
    color: white;
    font-weight: 600;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(0, 212, 255, 0.3);
    box-shadow: 
        0 5px 20px rgba(0, 212, 255, 0.2),
        inset 0 0 10px rgba(255, 255, 255, 0.05);
}

.nav-link.active::after {
    width: 100%;
    height: 3px;
    background: var(--gradient-neon);
    animation: digitalFlow 2s linear infinite, pulseActive 2s ease-in-out infinite;
}

@keyframes digitalFlow {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

@keyframes pulseActive {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
}

/* Base styling*/
.current-section-indicator {
    position: fixed;
    top: 80px;
    right: 5%;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    padding: 0.6rem 1.2rem;
    border-radius: 20px;
    border: 1px solid rgba(0, 212, 255, 0.2);
    box-shadow: 
        0 5px 20px rgba(0, 0, 0, 0.3),
        0 0 15px rgba(0, 212, 255, 0.1);
    color: var(--electric-blue);
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 1px;
    z-index: 999;
    opacity: 0;
    transform: translateY(-20px);
    transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    align-items: center;
    gap: 8px;
}

.current-section-indicator.visible {
    opacity: 1;
    transform: translateY(0);
}

/* Dot before text */
.current-section-indicator::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--electric-blue);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--electric-blue);
    animation: dotPulse 2s infinite;
}

@keyframes dotPulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
}

/* Text styling */
.indicator-text {
    font-family: 'Segoe UI', sans-serif;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: none; 
}

/* Mobile indicator */
@media (max-width: 768px) {
    .current-section-indicator {
        top: auto;
        bottom: 20px;
        right: 50%;
        transform: translateX(50%) translateY(20px);
        font-size: 0.8rem;
        padding: 0.5rem 1rem;
    }
    
    .current-section-indicator.visible {
        transform: translateX(50%) translateY(0);
    }
}

/* ===== RESPONSIVE MENU DESIGN ===== */

@media (max-width: 768px) {
    .nav-link {
        padding: 1rem 1.5rem;
        margin: 0.4rem 0;
        background: rgba(15, 23, 42, 0.7);
    }
    
    .nav-link.active {
        background: rgba(0, 212, 255, 0.15);
        border-color: rgba(0, 212, 255, 0.4);
    }
    
    .nav-link::after {
        bottom: -1px;
        left: 0;
        transform: none;
        width: 0;
    }
    
    .nav-link:hover::after,
    .nav-link.active::after {
        width: 100%;
        transform: none;
    }
}

/* Desktop enhancements */
@media (min-width: 769px) {
    .nav-links:hover .nav-link:not(:hover):not(.active) {
        opacity: 0.7;
    }
    
    .nav-link:hover {
        transform: translateY(-2px);
    }
}
</style>
</head>

<body>

<!-- Header -->
    <header id="header">
        <nav>
            <div class="logo">
                
                <div class="logo-text">YD '26</div>
            </div>
            <div class="tagline">Instigate a change</div>

            <div class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </div>
            
            <div class="nav-links" id="navLinks">
                <a href="#home" class="nav-link">Home</a>
                <a href="#highlights" class="nav-link">Highlights</a>
                <a href="yagna.html" class="nav-link">Yagna</a>
                <a href="dhruva.html" class="nav-link">Dhruva</a>
                <a href="#countdown" class="nav-link">Countdown</a>
                <a href="about/about.html" class="nav-link">About Us</a>
                <a href="#contact" class="nav-link">Contact</a>
            </div>
        </nav>
    </header>


<article id="about">

  <div class="about-left-panel"></div>

  <div class="about-inner">
    <h1><strong>THE<br>14th<br>EDITION</strong></h1>

    <div class="about-box-container">
      <div class="about-box box1" onclick="openAboutPopup('Mission')">
        <span>LBSITW</span>
      </div>
      <div class="about-box box2" onclick="openAboutPopup('Vision')">
        <span>YANGNA DHRUVA</span>
      </div>
      <div class="about-box box3" onclick="openAboutPopup('Values')">
        <span>THEME</span>
      </div>
    </div>
  </div>
  </article>

   


<!-- POPUP -->
<div id="about-popup">
  <div class="popup">
    <span onclick="closeAboutPopup()">✕</span>
    <h2 id="popup-title"></h2>
    <p id="popup-content"></p>
  </div>
</div>

<script>
function openAboutPopup(type){
  const text = {
    Mission: "Our mission is to create meaningful impact through innovation.",
    Vision: "Our vision is to shape the future with creativity and technology.",
    Values: "Integrity, teamwork, and excellence define our values."
  };
  document.getElementById("popup-title").innerText = type;
  document.getElementById("popup-content").innerText = text[type];
  document.getElementById("about-popup").style.display = "block";
}

function closeAboutPopup(){
  document.getElementById("about-popup").style.display = "none";
}
</script>

</body>
</html>
